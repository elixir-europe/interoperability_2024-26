  topnav:
    # theme: light
    brand_logo: assets/img/main_logo.svg
    # search: true
    # github: true
    # twitter: false
    # bluesky: false
    # linkedin: false
    # fosstodon: false
  # theme_color: 0d6efd
  # fonts:
  #   - url towards a font

plugins:
  - elixir-toolkit-theme-plugins
  - jekyll-redirect-from
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-github-metadata
  - jemoji
  - webrick

sass:
  style: compressed
  sourcemap: always
  # All four below fire from Bootstrap's own SCSS vendored inside the
  # elixir-toolkit-theme gem (pinned in Gemfile), not from anything in this
  # repo's _sass/ — confirmed by compiling with silence_deprecations: []
  # and checking every warning's source path. They'll keep firing on every
  # build until Bootstrap/the theme migrates off @import and the legacy
  # global/color function APIs; re-check when bumping the theme version.
  # (`mixed-decls` produces zero warnings against the current theme + this
  # repo's SCSS, so it's deliberately left out of this list.)
  silence_deprecations:
    - import
    - global-builtin
    - color-functions
    - if-function

github:
  repository_url: https://github.com/elixir-europe/interoperability_2024-26
  source:
    branch: main
